# Builds the MecHand web app and the documentation site and publishes both on
# GitHub Pages:  https://jordivillafreixa.github.io/MecHand/      (site)
#                https://jordivillafreixa.github.io/MecHand/app/  (MecHand)
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ketcher-mechhand/package-lock.json

      - name: Test and build MecHand
        working-directory: ketcher-mechhand
        env:
          MECHAND_BASE: /MecHand/app/
        run: |
          npm ci
          npm test
          npm run build

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: docs

      - name: Build the documentation site
        working-directory: docs
        run: bundle exec jekyll build --baseurl /MecHand

      - name: Put the app under /app
        run: cp -r ketcher-mechhand/dist docs/_site/app

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
