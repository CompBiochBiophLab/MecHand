# Builds the MecHand web app and the documentation website (VitePress) and
# publishes both on GitHub Pages:
#   https://compbiochbiophlab.github.io/MecHand/       website
#   https://compbiochbiophlab.github.io/MecHand/app/   MecHand
# Only a commit that passed CI (all tests, in the three browser engines) is
# published, so the public app is always a tested build.
name: Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit CI tested (not a newer one pushed meanwhile).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            ketcher-mechhand/package-lock.json
            docs/package-lock.json

      - name: Test and build MecHand
        working-directory: ketcher-mechhand
        env:
          MECHAND_BASE: /MecHand/app/
        run: |
          npm ci
          npm test
          npm run build

      - name: Build the website
        working-directory: docs
        run: |
          npm ci
          npm run build

      - name: Put the app under /app
        run: cp -r ketcher-mechhand/dist docs/.vitepress/dist/app

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
