# Checks every push and pull request.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app:
    name: App (types, unit tests, recognition benchmark, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ketcher-mechhand
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ketcher-mechhand/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  latex:
    name: LaTeX export compiles (TikZ, chemfig)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ketcher-mechhand
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ketcher-mechhand/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-pictures texlive-science texlive-plain-generic
      - run: npm ci
      - run: npm run test:latex

  e2e:
    name: Browser tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    defaults:
      run:
        working-directory: ketcher-mechhand
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ketcher-mechhand/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --project=${{ matrix.browser }}
      - name: Keep the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.browser }}
          path: ketcher-mechhand/test-results/
          retention-days: 7

  server:
    name: Recognition server (Python 3.13)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
