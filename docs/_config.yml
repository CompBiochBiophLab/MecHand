title: MecHand
description: >
  Freehand chemical mechanism drawing — a Ketcher extension with sketch recognition,
  contextual help, and direct export to chemfig/TikZ.
baseurl: "/Article_MecHand"
url: "https://jordi-villa.github.io"

# Theme
remote_theme: pages-themes/minimal@v0.2.0
plugins:
  - jekyll-remote-theme

# Navigation
nav:
  - title: Home
    url: /
  - title: Demo
    url: /demo/
  - title: Documentation
    url: /docs/
  - title: Manuscript
    url: /manuscript/

# Markdown settings
markdown: kramdown
highlighter: rouge
kramdown:
  syntax_highlighter: rouge

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
